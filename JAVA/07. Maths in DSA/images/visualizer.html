<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number System Visualizer</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top,
                    #1e293b 0%,
                    #0f172a 45%,
                    #020617 100%);
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .wrapper {
            width: min(1100px, 95vw);
            animation: fadeIn 1.2s ease;
        }

        svg {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.45));
        }

        .glass {
            fill: rgba(15, 23, 42, 0.92);
            stroke: #334155;
            stroke-width: 2;
        }

        .digit-box {
            fill: #1e293b;
            stroke: #475569;
            stroke-width: 4;
            rx: 18;
            transition: 0.4s ease;
        }

        .digit-text {
            fill: #e2e8f0;
            font-size: 42px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .title {
            fill: white;
            font-size: 34px;
            font-weight: bold;
            text-anchor: middle;
        }

        .step-text {
            fill: #93c5fd;
            font-size: 24px;
            font-weight: 600;
        }

        .formula {
            fill: #facc15;
            font-size: 24px;
            font-weight: bold;
        }

        .result {
            fill: #4ade80;
            font-size: 38px;
            font-weight: bold;
        }

        .invalid {
            fill: #f87171;
            font-size: 30px;
            font-weight: bold;
        }

        .code {
            fill: #cbd5e1;
            font-size: 20px;
            font-family: monospace;
        }

        .line {
            stroke: #334155;
            stroke-width: 2;
            stroke-dasharray: 10;
            opacity: 0.4;
        }

        .glow {
            animation: glow 1.4s ease infinite alternate;
        }

        .pulse {
            animation: pulse 1s ease infinite;
        }

        .floating {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 2px #38bdf8);
            }

            to {
                filter: drop-shadow(0 0 18px #38bdf8);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <svg viewBox="0 0 1000 620">
            <!-- CARD -->
            <rect x="10" y="10" width="980" height="600" rx="26" class="glass" />
            <!-- TITLE -->
            <text x="500" y="60" class="title">
                Number System Conversion Visualizer
            </text>
            <!-- SUBTITLE -->
            <text x="500" y="95" text-anchor="middle" fill="#64748b" font-size="18">
                Understanding Base Conversion Step by Step
            </text>
            <!-- CODE BLOCK -->
            <rect x="640" y="130" width="290" height="170" rx="18" fill="#020617" stroke="#1e293b" />
            <text x="665" y="165" class="code">convertToDecimal("4B",16)</text>
            <text x="665" y="205" class="code">digit(B) = 11</text>
            <text x="665" y="240" class="code">11 × 16⁰ = 11</text>
            <text x="665" y="275" class="code">4 × 16¹ = 64</text>
            <!-- DIVIDER -->
            <line x1="600" y1="120" x2="600" y2="530" class="line" />
            <!-- INPUT -->
            <text id="inputLabel" x="50" y="140" class="step-text" opacity="0">
                Input = "4B" • Base = 16
            </text>
            <!-- DIGIT 4 -->
            <g id="digit4" opacity="0" class="floating">
                <rect x="120" y="190" width="140" height="140" class="digit-box" />
                <text x="190" y="260" class="digit-text">4</text>
            </g>
            <!-- DIGIT B -->
            <g id="digitB" opacity="0" class="floating">
                <rect x="350" y="190" width="140" height="140" class="digit-box" />
                <text x="420" y="260" class="digit-text">B</text>
            </g>
            <!-- POSITIONS -->
            <text id="pos1" x="160" y="380" class="step-text" opacity="0">
                pos = 1
            </text>
            <text id="pos0" x="390" y="380" class="step-text" opacity="0">
                pos = 0
            </text>
            <!-- FORMULAS -->
            <text id="formula1" x="50" y="455" class="formula" opacity="0">
                B → 11 × 16⁰ = 11
            </text>
            <text id="formula2" x="50" y="500" class="formula" opacity="0">
                4 → 4 × 16¹ = 64
            </text>
            <!-- RESULT -->
            <text id="result" x="50" y="565" class="result" opacity="0">
                Final Result = 75
            </text>
            <!-- INVALID SECTION -->
            <text id="invalidTitle" x="50" y="140" class="step-text" opacity="0">
                Invalid Example → "48" in Base 2
            </text>
            <g id="invalidDigit4" opacity="0">
                <rect x="120" y="190" width="140" height="140" class="digit-box" />
                <text x="190" y="260" class="digit-text">4</text>
            </g>
            <g id="invalidDigit8" opacity="0" class="pulse">
                <rect x="350" y="190" width="140" height="140" class="digit-box" stroke="#ef4444" />
                <text x="420" y="260" class="digit-text">8</text>
            </g>
            <text id="invalidMsg" x="50" y="470" class="invalid" opacity="0">
                digit 8 ≥ base 2 → Invalid Number
            </text>
            <!-- ================= -->
            <!-- ANIMATIONS -->
            <!-- ================= -->
            <!-- SHOW INPUT -->
            <animate href="#inputLabel" attributeName="opacity" from="0" to="1" begin="0.5s" dur="1s" fill="freeze" />
            <!-- SHOW B -->
            <animate href="#digitB" attributeName="opacity" from="0" to="1" begin="2s" dur="1s" fill="freeze" />
            <!-- SHOW POS 0 -->
            <animate href="#pos0" attributeName="opacity" from="0" to="1" begin="4s" dur="1s" fill="freeze" />
            <!-- SHOW FORMULA -->
            <animate href="#formula1" attributeName="opacity" from="0" to="1" begin="6s" dur="1s" fill="freeze" />
            <!-- GLOW -->
            <animate href="#digitB rect" attributeName="stroke" values="#475569;#38bdf8;#475569" begin="6s" dur="2s" />
            <!-- SHOW 4 -->
            <animate href="#digit4" attributeName="opacity" from="0" to="1" begin="9s" dur="1s" fill="freeze" />
            <!-- SHOW POS 1 -->
            <animate href="#pos1" attributeName="opacity" from="0" to="1" begin="11s" dur="1s" fill="freeze" />
            <!-- SHOW FORMULA -->
            <animate href="#formula2" attributeName="opacity" from="0" to="1" begin="13s" dur="1s" fill="freeze" />
            <!-- RESULT -->
            <animate href="#result" attributeName="opacity" from="0" to="1" begin="16s" dur="1s" fill="freeze" />
            <!-- FADE OUT -->
            <animate href="#inputLabel" attributeName="opacity" from="1" to="0" begin="20s" dur="1s" fill="freeze" />
            <animate href="#digit4" attributeName="opacity" from="1" to="0" begin="20s" dur="1s" fill="freeze" />
            <animate href="#digitB" attributeName="opacity" from="1" to="0" begin="20s" dur="1s" fill="freeze" />
            <animate href="#formula1" attributeName="opacity" from="1" to="0" begin="20s" dur="1s" fill="freeze" />
            <animate href="#formula2" attributeName="opacity" from="1" to="0" begin="20s" dur="1s" fill="freeze" />
            <animate href="#result" attributeName="opacity" from="1" to="0" begin="20s" dur="1s" fill="freeze" />
            <animate href="#pos0" attributeName="opacity" from="1" to="0" begin="20s" dur="1s" fill="freeze" />
            <animate href="#pos1" attributeName="opacity" from="1" to="0" begin="20s" dur="1s" fill="freeze" />
            <!-- INVALID TITLE -->
            <animate href="#invalidTitle" attributeName="opacity" from="0" to="1" begin="23s" dur="1s" fill="freeze" />
            <!-- INVALID DIGITS -->
            <animate href="#invalidDigit4" attributeName="opacity" from="0" to="1" begin="25s" dur="1s" fill="freeze" />
            <animate href="#invalidDigit8" attributeName="opacity" from="0" to="1" begin="27s" dur="1s" fill="freeze" />
            <!-- INVALID MESSAGE -->
            <animate href="#invalidMsg" attributeName="opacity" from="0" to="1" begin="30s" dur="1s" fill="freeze" />
        </svg>
    </div>
</body>

</html>
