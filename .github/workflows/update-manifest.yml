name: Update manifest
on:
  push:
    branches: [main]
    paths: ["**/*.md", "scripts/**"]

# Cancel any in-progress run on the same branch so a rapid second push
# doesn't commit a stale manifest on top of a newer one.
concurrency:
  group: manifest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/generate-manifest.js
      - run: |
          if ! git diff --quiet notes-manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add notes-manifest.json
            git commit -m "chore: update manifest"
            git push
          fi
